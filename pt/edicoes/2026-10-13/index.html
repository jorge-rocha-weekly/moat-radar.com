<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekly Moat Radar</title></head><body><script>(async()=>{const base='/_payload/weekly-2026-10-13/pt-';let s='';for(let i=1;i<=7;i++){const r=await fetch(base+i+'.txt',{cache:'no-store'});if(!r.ok)throw new Error('Falha ao carregar edição');s+=await r.text()}document.open();document.write(s);document.close()})().catch(()=>{document.body.innerHTML='<p style="font-family:system-ui;padding:2rem">Não foi possível carregar esta edição.</p>'})</script></body></html>
