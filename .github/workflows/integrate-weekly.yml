name: Integrate Weekly
on:
  push:
    paths: ['.github/workflows/integrate-weekly.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Surgical update
        shell: python
        run: |
          from pathlib import Path
          import re
          def w(p,s): Path(p).write_text(s,encoding='utf-8')
          def r(p): return Path(p).read_text(encoding='utf-8')
          ptw=r('pt/weekly/index.html'); enw=r('en/weekly/index.html')
          def thumb(s,label):
              tail=s.split(label,1)[1]
              return re.search(r'<div class="entry"><div class="thumb">(.*?)</div><div>',tail,re.S).group(1)
          tpt=thumb(ptw,'Weeklies anteriores'); ten=thumb(enw,'Previous weeklies')
          if '/pt/edicoes/2026-09-23/' not in ptw:
              ptw=ptw.replace('16 a 22 de setembro</span>','23 a 29 de setembro</span>',1).replace('/pt/edicoes/2026-09-16/">Meta Muse seria um sinal antecipado de quem vai ganhar a corrida pelo consumidor?</a></h2><p class="sub">Quando a infraestrutura de um modelo se torna um ativo competitivo capaz de mover a bolsa.</p><a class="read-more" href="/pt/edicoes/2026-09-16/','/pt/edicoes/2026-09-23/">Seis assinaturas, nenhuma obrigação: quem controla a IA?</a></h2><p class="sub">A autonomia avança mais rápido do que os mecanismos de controle.</p><a class="read-more" href="/pt/edicoes/2026-09-23/',1)
              e=f'<div class="entry"><div class="thumb">{tpt}</div><div><div class="date">16 a 22 de setembro de 2026</div><h2><a href="/pt/edicoes/2026-09-16/">Meta Muse seria um sinal antecipado de quem vai ganhar a corrida pelo consumidor?</a></h2><p>Quando a infraestrutura de um modelo se torna um ativo competitivo capaz de mover a bolsa.</p></div></div>'
              ptw=ptw.replace('<div class="feed-label">Weeklies anteriores</div>','<div class="feed-label">Weeklies anteriores</div>'+e,1); w('pt/weekly/index.html',ptw)
          if '/en/editions/2026-09-23/' not in enw:
              enw=enw.replace('Sep 16–22</span>','Sep 23–29</span>',1).replace('/en/editions/2026-09-16/">Could Meta Muse be an early signal of who will win the race for the consumer?</a></h2><p class="sub">When a model\'s infrastructure becomes a competitive asset capable of moving the stock market.</p><a class="read-more" href="/en/editions/2026-09-16/','/en/editions/2026-09-23/">Six signatures, no obligation: who controls AI?</a></h2><p class="sub">Autonomy is advancing faster than the mechanisms meant to control it.</p><a class="read-more" href="/en/editions/2026-09-23/',1)
              e=f'<div class="entry"><div class="thumb">{ten}</div><div><div class="date">September 16-22, 2026</div><h2><a href="/en/editions/2026-09-16/">Could Meta Muse be an early signal of who will win the race for the consumer?</a></h2><p>When a model\'s infrastructure becomes a competitive asset capable of moving the stock market.</p></div></div>'
              enw=enw.replace('<div class="feed-label">Previous weeklies</div>','<div class="feed-label">Previous weeklies</div>'+e,1); w('en/weekly/index.html',enw)
          for p,old,new,subold,subnew,hrefold,hrefnew in [('pt/index.html','16 a 22 de setembro','23 a 29 de setembro','Meta Muse seria um sinal antecipado de quem vai ganhar a corrida pelo consumidor?','Seis assinaturas, nenhuma obrigação: quem controla a IA?','/pt/edicoes/2026-09-16/','/pt/edicoes/2026-09-23/'),('en/index.html','Sep 16–22','Sep 23–29','Could Meta Muse be an early signal of who will win the race for the consumer?','Six signatures, no obligation: who controls AI?','/en/editions/2026-09-16/','/en/editions/2026-09-23/')]:
              s=r(p)
              if hrefnew not in s:
                  s=s.replace(old,new,1).replace(hrefold,hrefnew,2).replace(subold,subnew,1)
                  s=s.replace('Quando a infraestrutura de um modelo se torna um ativo competitivo capaz de mover a bolsa.','A autonomia avança mais rápido do que os mecanismos de controle.',1) if p.startswith('pt') else s.replace("When a model's infrastructure becomes a competitive asset capable of moving the stock market.",'Autonomy is advancing faster than the mechanisms meant to control it.',1)
                  w(p,s)
          for p,mark,date,title,href,sub,th in [('pt/edicoes/index.html','<h1 style="margin-bottom:30px">Todas as edições</h1>','Weekly · 23 a 29 de setembro de 2026','Seis assinaturas, nenhuma obrigação: quem controla a IA?','/pt/edicoes/2026-09-23/','A autonomia avança mais rápido do que os mecanismos de controle.',tpt),('en/editions/index.html','<h1 style="margin-bottom:30px">All editions</h1>','Weekly · September 23-29, 2026','Six signatures, no obligation: who controls AI?','/en/editions/2026-09-23/','Autonomy is advancing faster than the mechanisms meant to control it.',ten)]:
              s=r(p)
              if href not in s:
                  e=f'<div class="entry"><div class="thumb">{th}</div><div><div class="date">{date}</div><h2><a href="{href}">{title}</a></h2><p>{sub}</p></div></div>'; w(p,s.replace(mark,mark+e,1))
          s=r('sitemap.xml')
          if 'pt/edicoes/2026-09-23/' not in s:
              a='<url><loc>https://moat-radar.com/pt/edicoes/2026-09-23/</loc><lastmod>2026-10-07</lastmod><changefreq>never</changefreq><priority>1.0</priority></url><url><loc>https://moat-radar.com/en/editions/2026-09-23/</loc><lastmod>2026-10-07</lastmod><changefreq>never</changefreq><priority>1.0</priority></url>'
              w('sitemap.xml',s.replace('</urlset>',a+'</urlset>'))
          Path('.github/workflows/integrate-weekly.yml').unlink()
      - name: Commit
        run: |
          git config user.name jorge-rocha-weekly
          git config user.email mailjrocha@gmail.com
          git add -A
          git commit -m "Integrate Weekly 23-29 Sep 2026" || exit 0
          git push