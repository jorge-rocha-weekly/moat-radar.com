<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Weekly Moat Radar · Edições</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFFFFF;
    --ink: #2B2B2E;
    --ink-soft: #55555C;
    --navy: #45597A;
    --navy-deep: #34486A;
    --brass: #B9975B;
    --lacre-deep: #8B3A2F;
    --hair: #E7E4DC;
    --serif: 'Spectral', Georgia, serif;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
  }
  .sheet{
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 32px 60px;
  }
  .masthead{ text-align:center; }
  .compass{ margin: 0 auto 18px; display:block; }
  .edition-line{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 2.5px;
    color: var(--brass);
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  h1.title{
    font-size: 38px;
    font-weight: 700;
    margin: 0 0 10px;
    color: var(--ink);
    letter-spacing: -0.5px;
  }
  h1.title em{
    font-style: italic;
    font-weight: 500;
    color: var(--lacre-deep);
  }
  .subtitle{
    font-style: italic;
    font-weight: 400;
    color: var(--ink-soft);
    font-size: 16px;
    margin: 0 0 6px;
  }
  hr.dashed{
    border: none;
    border-top: 1px dashed var(--hair);
    margin: 32px 0;
  }
  .list{ list-style: none; margin: 0; padding: 0; }
  .list li{
    border-bottom: 1px solid var(--hair);
    padding: 22px 0;
  }
  .list a{
    text-decoration: none;
    color: var(--ink);
    font-size: 20px;
    font-weight: 600;
  }
  .list a:hover{ color: var(--lacre-deep); }
  .list .date{
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--navy);
    text-transform: uppercase;
    margin-top: 6px;
  }
  .back{
    display: block;
    text-align: center;
    margin-top: 40px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--navy-deep);
  }
</style>
</head>
<body>
<div class="sheet">

  <div class="masthead">
    <svg class="compass" width="46" height="46" viewBox="0 0 46 46" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="23" cy="23" r="21" stroke="#B9975B" stroke-width="1.4"/>
      <circle cx="23" cy="23" r="15" stroke="#B9975B" stroke-width="0.8"/>
      <path d="M23 8 L27 23 L23 38 L19 23 Z" fill="#A85847" opacity="0.85"/>
      <circle cx="23" cy="23" r="2.4" fill="#34486A"/>
    </svg>
    <div class="edition-line">TODAS AS EDIÇÕES</div>
    <h1 class="title">Weekly <em>Moat</em> Radar</h1>
    <p class="subtitle">O mercado de IA, explicado semanalmente, com sinais fora do holofote</p>
  </div>

  <hr class="dashed">

  <ul class="list">
    <li>
      <a href="/edicoes/01/">Edição 01</a>
      <span class="date">25 a 31 de julho de 2026</span>
    </li>
  </ul>

  <a class="back" href="/">← Voltar para a edição mais recente</a>

</div>
</body>
</html>
