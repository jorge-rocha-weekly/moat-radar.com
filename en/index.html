<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moat Radar</title></head><body><script>(async()=>{const base='/_payload/home/en-';let s='';for(let i=1;i<=3;i++){const r=await fetch(base+i+'.txt',{cache:'no-store'});if(!r.ok)throw new Error('Failed to load home');s+=await r.text()}document.open();document.write(s);document.close()})().catch(()=>{document.body.innerHTML='<p style="font-family:system-ui;padding:2rem">This page could not be loaded.</p>'})</script></body></html>
